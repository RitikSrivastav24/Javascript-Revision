<html lang="en">
<head>

    const changeh1=function(){
        document.querySelector('h1').innerHTML='Hi I am learning Js'
    }

    const stop=setTimeout(changeh1,3000) //It change innerhtml of h1 after 3 seconds.

        console.log("Stopped!!")
    })
</script>
